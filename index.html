/* computer: wheel zoom about the pointer, drag to pan, keyboard */
let dwgWheelT=null;
document.addEventListener('wheel',e=>{ const wrap=e.target.closest&&e.target.closest('#dwgwrap'); if(!wrap||S.view!=='dwg'||!WIDE()) return; e.preventDefault();
  const stage=$('#dwgstage'), cv=stage.querySelector('canvas'); if(!cv) return;
  const z0=S.dwg.zoom||1, dy=e.deltaY*(e.deltaMode===1?33:e.deltaMode===2?300:1), z1=Math.min(8,Math.max(1,z0*Math.min(1.035,Math.max(0.965,Math.exp(-dy*0.00035))))); if(z1===z0) return; const k=z1/z0;
  const r=wrap.getBoundingClientRect(), sr=stage.getBoundingClientRect(); const px=e.clientX-sr.left, py=e.clientY-sr.top;
  const w=parseFloat(cv.style.width)*k, h=parseFloat(cv.style.height)*k;
  stage.classList.add('zooming'); cv.style.width=w+'px'; cv.style.height=h+'px'; stage.style.width=w+'px'; stage.style.height=h+'px';
  const sr2=stage.getBoundingClientRect(); wrap.scrollLeft+= (sr2.left+px*k)-e.clientX; wrap.scrollTop+= (sr2.top+py*k)-e.clientY;
  S.dwg.zoom=z1; S.dwg.hl=null; S.dwg.col=null; clearTimeout(dwgWheelT); dwgWheelT=setTimeout(()=>{ const sl=wrap.scrollLeft, st=wrap.scrollTop; drawDwg().then(()=>{ wrap.scrollLeft=sl; wrap.scrollTop=st; }); },220);
},{passive:false});
let dwgDrag=null;
document.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse'||e.button!==0) return; const wrap=e.target.closest&&e.target.closest('#dwgwrap'); if(!wrap) return; dwgDrag={x:e.clientX,y:e.clientY,sl:wrap.scrollLeft,st:wrap.scrollTop,wrap,moved:false}; });
document.addEventListener('pointermove',e=>{ if(!dwgDrag) return; const dx=e.clientX-dwgDrag.x, dy=e.clientY-dwgDrag.y; if(!dwgDrag.moved&&Math.hypot(dx,dy)<5) return; dwgDrag.moved=true; dwgDrag.wrap.classList.add('drag'); dwgDrag.wrap.scrollLeft=dwgDrag.sl-dx; dwgDrag.wrap.scrollTop=dwgDrag.st-dy; });
document.addEventListener('pointerup',()=>{ if(!dwgDrag) return; const d=dwgDrag; dwgDrag=null; d.wrap.classList.remove('drag'); if(d.moved){ const stop=ev=>{ ev.stopPropagation(); ev.preventDefault(); }; document.addEventListener('click',stop,{capture:true,once:true}); setTimeout(()=>document.removeEventListener('click',stop,{capture:true}),50); } });
document.addEventListener('keydown',e=>{ if(S.view!=='dwg'||!S.dwg||$('#layer .modal')||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return; const d=S.drawings[S.dwg.id]; if(!d) return;
  if(e.key==='ArrowRight'&&S.dwg.page<d.pages.length-1){ e.preventDefault(); dwgGo(S.dwg.id,S.dwg.page+1); }
  else if(e.key==='ArrowLeft'&&S.dwg.page>0){ e.preventDefault(); dwgGo(S.dwg.id,S.dwg.page-1); }
  else if(e.key==='+'||e.key==='='||e.key==='-'||e.key==='0'){ const z=S.dwg.zoom||1; S.dwg.zoom=e.key==='0'?1:e.key==='-'?Math.max(1,z/1.5):Math.min(8,z*1.5); S.dwg.hl=null; S.dwg.col=null; drawDwg(); }
  else if(e.key==='Escape'){ S.view='drawings'; S.tab='drawings'; render(); } });
let dwgResizeT=null; window.addEventListener('resize',()=>{ if(S.view==='dwg'){ clearTimeout(dwgResizeT); dwgResizeT=setTimeout(drawDwg,250); } });

/* ---------- Upload (admins) ---------- */
async function openDwgUpload(){
  modal(`<h2>Upload drawing PDFs</h2><p class="hint">Pick one or more panel drawing PDFs. Each is matched to its drawing set; new sets get their tags and cross-references read automatically. Uploading again replaces that set's PDF.</p>
   <input type="file" id="dwgfiles" accept="application/pdf" multiple>
   <div id="dwgrows" class="list" style="margin-top:10px"></div>
   <div class="actions"><button class="btn primary" type="button" id="dwgGo" disabled>Upload</button><button class="btn" type="button" data-act="close">Cancel</button></div><p class="hint" id="dwgmsg"></p>`);
  let items=[];
  $('#dwgfiles').addEventListener('change',async e=>{
    const files=[...e.target.files]; $('#dwgmsg').textContent='Reading files…'; items=[];
    const lib=await loadPdfJs();
    for(const f of files){ const buf=await f.arrayBuffer(); let pdf=null,guess='';
      try{ pdf=await lib.getDocument({data:new Uint8Array(buf.slice(0))}).promise; const pg=await dwgExtractPage(pdf,1); guess=pg.panel||''; }catch(err){}
      const n=pdf?pdf.numPages:0; const fname=f.name.replace(/\.pdf$/i,'');
      const sets=dwgSets(); const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
      let match=sets.find(s=>norm(s.fileName).replace(/PDF$/,'')===norm(fname))||sets.find(s=>!s.file&&s.pages.length===n&&(norm(fname).includes(norm(s.name))||norm(guess)===norm(s.panel)))
        ||sets.find(s=>s.pages.length===n&&(norm(fname).includes(norm(s.name))||(guess&&norm(guess)===norm(s.panel))));
      items.push({f,buf,pdf,n,guess,fname,target:match?match._id:'new'}); }
    $('#dwgrows').innerHTML=items.map((it,i)=>`<div class="card" style="padding:8px"><b>${esc(it.f.name)}</b> <span class="hint">${it.n} pages${it.guess?' · title block says '+esc(it.guess):''}</span>
      <div class="field"><label for="dwgt${i}">Goes to</label><select id="dwgt${i}" data-i="${i}">${dwgSets().map(s=>`<option value="${esc(s._id)}" ${it.target===s._id?'selected':''}>${esc(s.name)} – ${esc(s.title||'')} (${s.pages.length} sheets)${s.file?' – replace':''}</option>`).join('')}<option value="new" ${it.target==='new'?'selected':''}>New drawing set: ${esc(it.guess||it.fname)}</option></select></div></div>`).join('');
    $('#dwgrows').querySelectorAll('select').forEach(sl=>sl.addEventListener('change',()=>{ items[+sl.dataset.i].target=sl.value; }));
    $('#dwgmsg').textContent=''; $('#dwgGo').disabled=!items.length;
  });
  $('#dwgGo').addEventListener('click',async()=>{
    const btn=$('#dwgGo'); btn.disabled=true; let ok=0;
    for(const it of items){
      try{
        $('#dwgmsg').textContent='Uploading '+it.f.name+'…';
        let id=it.target, rec;
        if(id==='new'){ const name=(it.guess&&!/\s/.test(it.guess)?it.guess:it.fname).replace(/\s+Rev\s*\w+$/i,'').trim(); id=idOf(S.job,'DWG~'+name);
          $('#dwgmsg').textContent='Reading tags on '+it.f.name+'…';
          const pages=[]; for(let n=1;n<=it.n;n++) pages.push(await dwgExtractPage(it.pdf,n));
          const panel=pages[0].panel||name; const sheets=new Set(pages.map(p=>p.sheet));
          pages.forEach(p=>{ p.links=p.links.filter(l=>!(l.k==='b'&&l.v===panel) && !(l.k==='x'&&l.bare&&!sheets.has(l.s))); p.links.forEach(l=>delete l.bare); });
          rec={name,panel,title:it.fname,fileName:it.f.name,pages,order:Object.keys(S.drawings).length,job:S.job}; }
        else { rec=Object.assign({},S.drawings[id]); delete rec._id; }
        const path=S.job+'/'+id.split('~').pop().replace(/[^A-Za-z0-9_.-]/g,'_')+'.pdf';
        const {error:ue}=await sb.storage.from('drawings').upload(path,new Blob([it.buf],{type:'application/pdf'}),{contentType:'application/pdf',upsert:true}); if(ue) throw ue;
        rec.file=path; rec.fileName=it.f.name; rec.uploadedAt=new Date().toISOString(); rec.uploadedBy=S.profile.name||S.email||'';
        const m=/Rev\s*([A-Z0-9]+)/i.exec(it.f.name); if(m) rec.rev='Rev '+m[1].toUpperCase();
        delete PDF_CACHE[path]; try{ const c=await caches.open('nzes-dwg'); await c.delete('/dwg/'+path); }catch(_){}
        await S.db.doc('drawings/'+id).set(rec); ok++;
      }catch(err){ toast('Failed: '+it.f.name+' ('+(err.message||err.code||'error')+')'); }
    }
    $('#dwgmsg').textContent=''; closeModal(); toast(ok+' drawing set'+(ok===1?'':'s')+' uploaded');
  });
}
/* Read the title block, cross-references and tags from one PDF page (text PDFs only) */
const DWG_TAG=/(?<![A-Z0-9])[NO]?(\d{3})-?([A-Z]{2,3})-?(\d{2})(?!\d)/;
const DWG_X=/^(?:\+([A-Z0-9-]+))?\/(\d{3})(?:\.(\d+))?$/;
async function dwgExtractPage(pdf,n){
  const page=await pdf.getPage(n); const vp=page.getViewport({scale:1}); const tc=await page.getTextContent();
  const ws=[];
  tc.items.forEach(it=>{ if(!it.str||!it.str.trim()) return; const t=pdfjsLib.Util.transform(vp.transform,it.transform);
    const h=Math.hypot(t[2],t[3])||8; const vert=Math.abs(t[1])>Math.abs(t[0]); const up=t[1]<0;
    const cw=(it.width||it.str.length*h*0.5)/Math.max(1,it.str.length); let o=0;
    it.str.split(/(\s+)/).forEach(part=>{ const L=part.length*cw; if(part.trim()){
        if(!vert) ws.push({x:t[4]+o,y:t[5]-h,x2:t[4]+o+L,y2:t[5],t:part});
        else if(up) ws.push({x:t[4]-h,y:t[5]-o-L,x2:t[4],y2:t[5]-o,t:part});
        else ws.push({x:t[4],y:t[5]+o,x2:t[4]+h,y2:t[5]+o+L,t:part}); }
      o+=L; }); });
  const H=vp.height; let panel='',sheet='',title='';
  const ee=ws.find(w=>w.t==='=EE');
  if(ee){ const col=ws.filter(w=>Math.abs(w.x-ee.x)<3&&w.y>ee.y+3).sort((a,b)=>a.y-b.y);
    if(col.length>=2){ panel=ws.filter(w=>Math.abs(w.y-col[0].y)<2&&w.x>=ee.x-1&&w.x<ee.x+110&&w.t!=='Page').sort((a,b)=>a.x-b.x).map(w=>w.t).join(' ').replace(/^\+/,''); sheet=col[1].t; } }
  const de=ws.find(w=>w.t==='Description'&&w.y>H-100&&w.x>350);
  if(de) title=ws.filter(w=>Math.abs(w.y-de.y)<2&&w.x>de.x2+5&&w.x<de.x+260).sort((a,b)=>a.x-b.x).map(w=>w.t).join(' ');
  const links=[];
  ws.forEach(w=>{ if(w.y>H-95) return; const r=v=>Math.round(v*10)/10; const box={x:r(w.x),y:r(w.y),w:r(w.x2-w.x),h:r(w.y2-w.y)};
    const m=DWG_X.exec(w.t); if(m){ links.push(Object.assign({k:'x',p:m[1]||'',s:m[2],c:m[3]||''},box)); return; }
    const m2=/^(\d{3})\.(\d{1,2})$/.exec(w.t); if(m2&&n>0){ links.push(Object.assign({k:'x',s:m2[1],c:m2[2],bare:1},box)); return; }
    const t=DWG_TAG.exec(w.t); if(t){ const v=t[1]+'-'+t[2]+'-'+t[3]; links.push(Object.assign({k:'t',v,txt:w.t},box)); return; }
    const b=w.t.replace(/^[+-]+/,'').split(':')[0]; if(b.length>=4&&S.boards[b]) links.push(Object.assign({k:'b',v:b,txt:w.t},box)); });
  const cols=ws.filter(w=>w.y<40&&/^\d{1,2}$/.test(w.t)).map(w=>Math.round((w.x+w.x2)/2*10)/10).sort((a,b)=>a-b);
  return {n,panel:panel||'',sheet:sheet||String(n),title:(title||('Sheet '+n)).replace(/\b([A-Z])([A-Z]+)\b/g,(m,x,y)=>x+y.toLowerCase()),w:vp.width,h:vp.height,cols,links};
}

init();
