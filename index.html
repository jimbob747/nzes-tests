<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NZES Test Recorder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2324415f'/%3E%3Cpath d='M18 33l9 9 19-20' stroke='%23f2a900' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<style>
/* Layout: one column, phone first. Sticky top bar, list of assets, drill into asset, drill into one test section. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#16202b; --muted:#5b6876; --line:#d3dae1;
  --accent:#f2a900; --accent-ink:#1b1400; --steel:#24415f;
  --pass:#1e8a4c; --fail:#c62f2f; --warn:#b86e00; --part:#2f6fb5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",Arial,Helvetica,sans-serif;
  --mono:"JetBrains Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --surface:#18212a; --ink:#e7edf3; --muted:#9aa8b6; --line:#2c3844;
    --accent:#f5b82a; --accent-ink:#1b1400; --steel:#9cc0e6;
    --pass:#43c07a; --fail:#ff6b6b; --warn:#f0a43a; --part:#6aa8f0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --ink:#e7edf3; --muted:#9aa8b6; --line:#2c3844;
  --accent:#f5b82a; --accent-ink:#1b1400; --steel:#9cc0e6;
  --pass:#43c07a; --fail:#ff6b6b; --warn:#f0a43a; --part:#6aa8f0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
.tag{font-family:var(--mono);font-size:.92em}
.top{position:sticky;top:0;z-index:5;background:var(--steel);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center}
:root[data-theme="dark"] .top{background:#14283d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top{background:#14283d}}
.top h1{font-size:1.35rem;flex:1 1 auto;min-width:5.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-family:var(--body);font-weight:500;font-size:.8rem;opacity:.85;margin-left:8px}
.top select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 8px;max-width:62vw;min-width:0;text-overflow:ellipsis}
.top select option{color:#000}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:14px 16px 90px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.banner{border-left:5px solid var(--warn);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:.95rem}
.banner.err{border-color:var(--fail)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.done b{color:var(--pass)} .stat.part b{color:var(--part)} .stat.fail b{color:var(--fail)}
.search{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.05rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 0;cursor:pointer;text-align:left;width:100%}
.row:focus-visible,.btn:focus-visible,.chip:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stripe{align-self:stretch;border-radius:10px 0 0 10px;background:var(--line)}
.s-done .stripe{background:var(--pass)} .s-part .stripe{background:var(--part)} .s-fail .stripe{background:var(--fail)}
.row .t1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.row .t1 .tag{font-weight:500}
.row .d{color:var(--muted);font-size:.92rem}
.pill{font-size:.78rem;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;border:1px solid currentColor}
.p-none{color:var(--muted)} .p-part{color:var(--part)} .p-done{color:var(--pass)} .p-fail{color:var(--fail)} .p-na{color:var(--muted)} .p-warn{color:var(--warn)}
.prog{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-align:right}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:14px 18px;font-size:1.05rem}
.btn.danger{color:var(--fail)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 14px;margin-top:10px}
.kv div span{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kv div b{font-weight:600;font-variant-numeric:tabular-nums}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:6px 2px 0}
.sechead h3{font-size:1.15rem}
.sechead small{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:left;display:grid;gap:4px;border-top:4px solid var(--line)}
.tile.r-pass,.tile.r-rec{border-top-color:var(--pass)} .tile.r-fail{border-top-color:var(--fail)} .tile.r-na{border-top-color:var(--muted)} .tile.r-warn{border-top-color:var(--warn)}
.tile .h{display:flex;justify-content:space-between;gap:6px;font-weight:600}
.tile .m{font-size:.85rem;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:.8rem;color:var(--ink);overflow-wrap:anywhere}
.flags{margin-top:10px;font-size:.88rem;color:var(--warn)}
.flags li{margin:2px 0}
form.test{display:grid;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.field{display:grid;gap:4px}
.field label{font-size:.82rem;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{padding:11px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:1.05rem;width:100%;font-variant-numeric:tabular-nums}
.field input.bad{border-color:var(--fail);box-shadow:0 0 0 2px color-mix(in srgb,var(--fail) 25%,transparent)}
.field input.good{border-color:var(--pass)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:10px 4px;cursor:pointer;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].y{background:var(--pass);color:#fff}
.seg button[aria-pressed="true"].n{background:var(--fail);color:#fff}
.seg button[aria-pressed="true"].x{background:var(--muted);color:#fff}
.seg button[aria-pressed="true"].o{background:var(--steel);color:#fff}
.checks{display:grid;gap:8px}
.checkrow{display:grid;grid-template-columns:1fr 170px;gap:10px;align-items:center}
.safety{border:2px solid var(--warn);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.safety input{width:24px;height:24px;margin-top:2px}
.hint{font-size:.85rem;color:var(--muted)}
.result{font-family:var(--display);font-size:1.3rem}
.hist{width:100%;border-collapse:collapse;font-size:.85rem}
.hist th,.hist td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.hist td.v{font-family:var(--mono);font-size:.78rem;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photos figure{margin:0;position:relative}
.photos img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;cursor:pointer;background:var(--bg)}
.photos .rm{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--fail);color:#fff;font-weight:700;cursor:pointer}
.camlabel{display:grid;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;cursor:pointer;min-width:200px}
.camlabel.primary{border-color:var(--accent)}
.camlabel input[type=file]{font-size:.85rem;color:var(--muted);max-width:100%}
.camlabel input[type=file]::file-selector-button{font:inherit;font-weight:600;padding:10px 14px;margin-right:8px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.bigphoto{width:100%;max-height:75vh;object-fit:contain;border-radius:8px;background:#000}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;font-weight:600;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:15}
.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:14px 14px 0 0}
textarea.csv{font-family:var(--mono);font-size:.8rem;min-height:160px}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}.checkrow{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:-4px 0 4px}
.tabbtn{flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 8px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tabbtn[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
table.sched{width:100%;border-collapse:collapse;font-size:.92rem}
table.sched th{text-align:left;font-size:.78rem;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.sched td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.sched tr.click{cursor:pointer} table.sched tr.click:hover{background:var(--line)}
table.sched tr.spare td{color:var(--muted)}
table.sched tr.s-fail td:first-child{box-shadow:inset 4px 0 var(--fail)} table.sched tr.s-done td:first-child{box-shadow:inset 4px 0 var(--pass)} table.sched tr.s-part td:first-child{box-shadow:inset 4px 0 var(--part)}
table.sched .tag.small{font-size:.75rem;opacity:.8}
table.sched .warnnote{color:var(--warn);font-size:.8rem}
table.sched.edit td{padding:4px} table.sched.edit input,table.sched.edit select{font:inherit;font-size:.9rem;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}

/* drawings */
.dwgbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.dwgbar select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:min(100%,360px)}
.dwgtog{display:flex;gap:6px;align-items:center}
.dwghead{margin:2px 0 6px}
.dwgwrap{overflow:auto;max-height:calc(100vh - 170px);background:#fff;border:1px solid var(--line);border-radius:8px;-webkit-overflow-scrolling:touch}
.dwgstage{position:relative;margin:0 auto;min-height:200px}
.dwgstage canvas{display:block}
.dwgload{padding:30px;color:#555}
.dlink{position:absolute;padding:0;border:1.5px solid rgba(242,169,0,.85);background:rgba(242,169,0,.12);border-radius:3px;cursor:pointer}
.dlink.lt{border-color:rgba(30,138,76,.9);background:rgba(30,138,76,.12)}
.dlink.lx{border-color:rgba(47,111,181,.9);background:rgba(47,111,181,.12)}
.dlink.lb{border-color:rgba(36,65,95,.9);background:rgba(36,65,95,.1)}
.dlink.lu{border-style:dashed}
.dlink.hide{border-color:transparent;background:transparent}
.dlink.hl{border:3px solid #e0115f;background:rgba(224,17,95,.15);animation:dpulse 1.2s ease-in-out 3}
@keyframes dpulse{50%{box-shadow:0 0 0 8px rgba(224,17,95,.25)}}
.dwgcol{position:absolute;top:0;bottom:0;background:rgba(47,111,181,.10);border-left:2px solid rgba(47,111,181,.5);border-right:2px solid rgba(47,111,181,.5);pointer-events:none}

/* computer layout */
main.wide{max-width:1560px} main.full{max-width:none}
.wo,.wideonly,.dwgside{display:none}
@media (min-width:1100px){
  main.wide,main.full{padding-bottom:16px}
  .split{display:grid;grid-template-columns:minmax(360px,430px) minmax(0,1fr);gap:16px;align-items:start}
  .split.b{grid-template-columns:minmax(480px,44%) minmax(0,1fr)}
  .pane{max-height:calc(100vh - 84px);overflow:auto;display:grid;gap:14px;align-content:start;padding:2px 6px 30px 2px}
  .pl .stats,.pl .hint{display:none}
  .pl .sel{outline:3px solid var(--accent);outline-offset:-2px}
  tr.sel td{background:rgba(242,169,0,.14)}
  .wo{display:table-cell} .pl .wo{display:none} .wideonly{display:block}
  .dwgmain{display:grid;grid-template-columns:230px minmax(0,1fr);gap:10px;align-items:start}
  .dwgside{display:grid;gap:2px;max-height:calc(100vh - 212px);overflow:auto;align-content:start}
  .dwgside button{font:inherit;font-size:.86rem;text-align:left;background:none;border:0;border-left:3px solid transparent;border-radius:0 6px 6px 0;padding:6px 8px;color:var(--ink);cursor:pointer}
  .dwgside button:hover{background:var(--surface)} .dwgside button.on{background:var(--surface);border-left-color:var(--accent);font-weight:600}
  .dwgwrap{height:calc(100vh - 212px);max-height:none;cursor:grab} .dwgwrap.drag{cursor:grabbing;user-select:none}
  #dwgsheet{display:none}
}
.dwgstage.zooming .dlink,.dwgstage.zooming .dwgcol{display:none}

/* summary */
.sumgrid{display:grid;gap:14px} @media (min-width:1100px){.sumgrid{grid-template-columns:1fr 1fr;align-items:start}}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.b-done{background:var(--pass)}.b-part{background:var(--part)}.b-fail{background:var(--fail)}.b-none{background:var(--line)}
.key{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:8px;vertical-align:middle}
table.sum td.bad{color:var(--fail);font-weight:700} table.sum tr.click{cursor:pointer} table.sum tr.click:hover td{background:rgba(127,127,127,.08)}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;height:120px;align-items:end}
.days>div{display:grid;grid-template-rows:1fr auto auto;height:100%;justify-items:center;position:relative}
.days span{align-self:end;width:70%;background:var(--part);border-radius:3px 3px 0 0;min-height:0}
.days small{font-size:.7rem;color:var(--muted);position:absolute;top:0}.days em{font-style:normal;font-size:.7rem;color:var(--muted)}
.dnotes{display:grid;gap:8px;border-left:3px solid var(--line);padding-left:10px;margin:4px 0}
.tabbtn{white-space:nowrap;font-size:.95rem;padding-left:4px;padding-right:4px}
@media (max-width:480px){.tabbtn{font-size:.8rem}}

/* fast entry */
.mpart{border-top:2px solid var(--line);padding-top:10px;display:grid;gap:10px}
.mres{font-weight:700;font-size:.9rem;text-align:right}
.mck summary{cursor:pointer;color:var(--muted);padding:6px 0}
.banner.ok{border-color:var(--pass);color:var(--pass);font-weight:600}
table.bulk input:not([type=checkbox]){width:4.6rem;padding:8px 6px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
table.bulk input[type=checkbox]{width:24px;height:24px}
table.bulk td{vertical-align:middle;text-align:center} table.bulk td:nth-child(-n+2){text-align:left} table.bulk td.na{color:var(--muted)}
table.bulk td.had small{display:block;color:var(--muted)} table.bulk td.bad small{display:block;color:var(--fail);font-weight:700}
table.bulk input.bad{border-color:var(--fail);background:rgba(198,47,47,.12)} table.bulk input.good{border-color:var(--pass)} table.bulk input.warnc{border-color:var(--warn)}
table.bulk th{position:sticky;top:0;background:var(--surface);font-size:.8rem}
@media (max-width:1099px){ body:not(.office-on) .office{display:none!important} }
@media (min-width:1100px){ .wide-hide{display:none} }
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Test Recorder<small id="jobname">Loading…</small></h1>
  <select id="jobsel" aria-label="Job"></select>
  <button class="iconbtn" id="profileBtn" type="button">Me</button>
</header>
<main id="app">
  <div class="card"><h2>Loading assets…</h2><p class="hint">Connecting to the shared test database.</p></div>
</main>
<div id="layer"></div>
<script>
"use strict";
/* ================= NZES Test Recorder – Supabase backend =================
   Fill in these two values from Supabase: Project Settings > API.
   The anon key is safe to publish – row-level security in schema.sql protects the data. */
const SUPABASE_URL  = 'https://plsxvvjnydwqqrgqzfui.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsc3h2dmpueWR3cXFyZ3F6ZnVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5NTgwNDEsImV4cCI6MjExMDUzNDA0MX0.RB2rNjzaRkfNtBIAqKlQaMHvnBOL0K18khIr0pB3xKY';
/* ======================================================================= */
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const errOf = e => ({code: !e ? 'unavailable' : (e.code==='42501'||/row-level security|permission/i.test(e.message||'')) ? 'invalid_argument' : (e.code||'unavailable'), message: e&&e.message||''});
const asSnap = rows => ({docs: rows.map(r=>({id:r.id, exists:true, data:()=>r.data})), metadata:{fromCache:false}});

/* ================= Offline: saved copy of job data + queue of tests waiting to upload ================= */
const KV=(()=>{ let dbp=null;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{ const r=indexedDB.open('nzes-tests',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const tx=async(mode,fn)=>{ const db=await open(); return new Promise((res,rej)=>{ const t=db.transaction('kv',mode); const rq=fn(t.objectStore('kv')); t.oncomplete=()=>res(rq.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); };
  return {get:k=>tx('readonly',s=>s.get(k)).catch(()=>undefined), set:(k,v)=>tx('readwrite',s=>s.put(v,k)).then(()=>true).catch(()=>false)}; })();
const NET={pending:[],reloaders:new Set(),syncing:false,ready:null};
NET.ready=KV.get('pending').then(p=>{ if(Array.isArray(p)) NET.pending=p; });
function setOffline(v){ if(S.offline===v) return; S.offline=v; if(!v){ S.stale=false; syncPending(); } if(S.view!=='form'&&S.view!=='dwg') render(); else netBanner(); }
function netBanner(){ const el=document.getElementById('netbar'); if(el) el.outerHTML=netBarHtml(); }
function netBarHtml(){
  const mine=NET.pending.length, nd=NET.pending.filter(p=>p.table==='defects').length, bad=NET.pending.filter(p=>p.err).length;
  if(!S.offline&&!mine) return '<div id="netbar"></div>';
  return `<div id="netbar">${S.offline?`<div class="banner">📴 <b>Offline</b> – showing the copy saved on this device. Tests you save are kept here and upload when signal returns.</div>`:''}

/* Minimal document-store API over three tables (jobs, assets, tests) + profiles */
function makeDb(){
  const watch=(table,filter,next,error)=>{
    let alive=true, served=false, live=false; const ck='c:'+table+':'+(filter?filter[1]:'all');
    const fromCache=async()=>{ const rows=await KV.get(ck); if(!alive||live||served||!rows) return !!rows&&served; served=true; const sn=asSnap(rows); sn.metadata.fromCache=true; next(sn); return true; };
    fromCache();
    const load=async()=>{ let q=sb.from(table).select('id,data').order('created_at',{ascending:true}).limit(10000);
      if(filter) q=q.eq(filter[0],filter[1]);
      let r;
      if(navigator.onLine===false) r={error:{message:'offline',code:''}};
      else { if(S.noSession){ const g=await withTimeout(sb.auth.getSession(),8000); if(g.data&&g.data.session) S.noSession=false; }
        r=S.noSession?{error:{message:'no session',code:''}}:await withTimeout(q,15000); }
      if(r.error&&served&&/jwt|401/i.test((r.error.message||'')+(r.error.code||''))) r={error:{message:'auth',code:''}};
      const data=r.data, e=r.error; if(!alive) return;
      if(e){ if(errOf(e).code==='unavailable'){ const had=served||await fromCache(); if(had||served){ setOffline(true); return; } } error&&error(errOf(e)); return; }
      live=true; KV.set(ck,data||[]); setOffline(false); next(asSnap(data||[])); };
    NET.reloaders.add(load);
    let t=null; const soon=()=>{ clearTimeout(t); t=setTimeout(load,250); };
    const ch=sb.channel(table+'-'+(filter?filter[1]:'all')+'-'+Math.random().toString(36).slice(2))
      .on('postgres_changes',{event:'*',schema:'public',table,...(filter?{filter:filter[0]+'=eq.'+filter[1]}:{})},soon)
      .subscribe();
    load();
    const onVis=()=>{ if(document.visibilityState==='visible') load(); }; document.addEventListener('visibilitychange',onVis);
    return ()=>{ alive=false; NET.reloaders.delete(load); sb.removeChannel(ch); document.removeEventListener('visibilitychange',onVis); };
  };
  const collection=name=>{
    const q={_f:null,
      where(field,op,value){ const n=Object.create(q); n._f=[field,value]; return n; },
      onSnapshot(next,error){ return watch(name,this._f,next,error); },
      async add(rec){
        if(name!=='tests'){ const {data,error:e}=await sb.from(name).insert({job:rec.job,data:rec}).select('id').single(); if(e) throw errOf(e); return {id:data.id}; }
        const row={id:crypto.randomUUID(),job:rec.job,data:rec};   // id made here so a retried upload can never double up
        if(navigator.onLine===false||S.noSession) return queueTest(row);
        const {error:e}=await withTimeout(sb.from('tests').insert(row),10000);
        if(!e) return {id:row.id};
        if(errOf(e).code==='unavailable'){ setOffline(true); return queueTest(row); }
        throw errOf(e); }};
    return q;
  };
  const doc=path=>{
    const parts=path.split('/');
    if(parts[0]==='data'){ // data/users/<uid>/profile
      const uid=parts[2];
      return {async get(){ const {data,error:e}=await sb.from('profiles').select('data').eq('id',uid).maybeSingle(); if(e) throw errOf(e); return {exists:!!data,data:()=>data&&data.data}; },
              async set(d){ const {error:e}=await sb.from('profiles').upsert({id:uid,data:d}); if(e) throw errOf(e); }};
    }
    const [table,id]=parts;
    return {
      async set(d){ const row={id,data:d}; if(table!=='jobs') row.job=d.job; const {error:e}=await sb.from(table).upsert(row); if(e) throw errOf(e); },
      async update(patch){ const {data,error:e}=await sb.from(table).select('data').eq('id',id).single(); if(e) throw errOf(e);
        const {error:e2}=await sb.from(table).update({data:Object.assign({},data.data,patch)}).eq('id',id); if(e2) throw errOf(e2); },
      async delete(){ const {error:e}=await sb.from(table).delete().eq('id',id); if(e) throw errOf(e); }
    };
  };
  return {collection,doc};
}

const DEF_LIMITS={irMin:1,contMax:1,u0:230,mB:4,mC:7.5,mD:12.5,zsFactor:1,rphF:0.64,rcd1:300,rcd5:40,flcOver:0};

/* Read rating and curve out of a protection string: "20A C", "C20", "S201-C6", "NSX250F 3P 200A", "TeSys GV2L20 25A" */
function parseProt(p){
  p=String(p||'').replace(/RCD.*$/i,''); const r={In:'',curve:''};
  let m=/(\d+(?:\.\d+)?)\s*A\s*([BCD])\b/i.exec(p); if(m){ r.In=m[1]; r.curve=m[2].toUpperCase(); return r; }
  m=/(?:^|[\s-])([BCD])\s?(\d{1,3})(?:\s*A)?\b/.exec(p); if(m){ r.In=m[2]; r.curve=m[1]; return r; }
  const all=[...p.matchAll(/(\d+(?:\.\d+)?)\s*A\b/gi)]; if(all.length) r.In=all[all.length-1][1];
  if(/NSX|\bNS\d|MCCB|MTZ|GV\d|MS1\d\d/i.test(p)) r.curve='MCCB'; else if(/FUSE|HRC|gG/i.test(p)) r.curve='Fuse';
  return r;
}

}

/* Dead test: only the circuit's own active + earth conductors are measured, so the limit is a fraction of Zs max (the rest is allowed for the supply) */
function zsMaxFor(vals){ const e=parseNum(vals.zmax); if(isFinite(e)) return {z:e,src:'entered'}; const c=zsCalc(vals); if(!c) return null;
  if(zsDead(vals)){ const f=LIM().rphF; return {z:Math.round(c.z*f*100)/100,src:'calc',txt:c.txt+' × '+f}; } return {z:c.z,src:'calc',txt:c.txt}; }

  const c=zsMaxFor(Object.assign({},F.vals,{zmax:''})), e=parseNum(F.vals.zmax), what=dead?'Max resistance':'Zs max';
  el.textContent= isFinite(e)?('Using the '+what.toLowerCase()+' you entered ('+F.vals.zmax+' Ω).'+(c?' Calculated would be '+c.z+' Ω.':''))

const YNN = ['Y','N','N/A'];
const UNIT = {ir:' MΩ',ohm:' Ω',z:' Ω',ms:' ms',amp:' A'};
const CHECKS_CABLE = ['Cable tied','Cable labelled','Correct cable type / size','Core / ferrule numbers fitted','Correct gland','Lugged correctly','Segregation','Spare cores earthed','Correct colour code','Terminated as per drawings'];
const CHECKS_STARTER = ['Nameplate fitted','MCC drawing correct','Colour coding correct'];

const SIG_RE=/PAIR|\bPR\b|\d\s*PR|TRIPPLE|TRIPLE|THERMISTOR|SECURITY|MULTICOR|\bCORE\b|\d+\s*C\b(?!\+)|RS485|BELDEN/i;
const EARTH_RE=/EARTH|WRICON|BARE|G\/Y/i;
function isSignal(c){ const t=(c&&c.type)||''; return SIG_RE.test(t) && !/\dC\+E/i.test(t); }
function isEarthCable(c){ return EARTH_RE.test((c&&c.type)||''); }
function sigCores(type){
  const t=(type||'').toUpperCase(); let n=0, m;
  if(/TRIPPLE|TRIPLE/.test(t)) n=3;
  else if((m=t.match(/(\d+)\s*(PAIR|PR)/))) n=+m[1]*2;
  else if(/PAIR|THERMISTOR/.test(t)) n=2;
  else if((m=t.match(/(\d+)\s*(C\b|CORE)/))) n=+m[1];
  else if(/SECURITY/.test(t)) n=6;
  n=Math.min(n||4,12);
  return Array.from({length:n},(_,i)=>'Core '+(i+1));
}
function coresFor(type){
  const t=(type||'').toUpperCase();
  if(EARTH_RE.test(t)) return {cont:['Earth conductor'], ir:[]};
  if(isSignal({type})) return {cont:[...sigCores(type),'Screen / drain'], ir:['Core–core','All cores–screen/earth']};
  if(/2C\+E/.test(t)) return {cont:['L','N','E'], ir:['P-N','P-E','N-E']};
  if(/3C\+E/.test(t)||/VSD/.test(t)) return {cont:['L1','L2','L3','E'], ir:['R-Y','Y-B','R-B','R-E','Y-E','B-E']};
  if(/4C\+E/.test(t)) return {cont:['L1','L2','L3','N','E'], ir:['R-Y','Y-B','R-B','P-N','P-E','N-E']};
  return {cont:['L1','L2','L3','N','E'], ir:['R-Y','Y-B','R-B','P-N','P-E']};
}
function isMotor(a){ return a.sheet==='MCTS'; }
function is3ph(c){ return /3C\+E|4C\+E|VSD|1C \(|4C\b/i.test((c&&c.type)||''); }
function isDriveOutput(c){ return /^(B\d\d(SC|FN)\d\d|\d{3}SC\d\d-)/i.test((c&&c.no)||''); }   // VSD output or fan-to-fan loop: drive/upstream cable protects it
/* A measured fault loop is only required on socket-outlet circuits with no RCD; elsewhere it is optional (earth continuity covers it) */
function isSocketCct(a){ return /socket|outlet|\bGPO\b|\bS\/O\b|power ?point|\bplug/i.test((a.desc||'')+' '+(a.type||'')); }
/* AS/NZS 3000:2018 cl. 8.3.9.1: EFLI test needed for socket-outlet circuits unless protected by an RCD of 30 mA or less */
function rcd30(a){ const t=(a.rcd||'')+' '+(a.prot||''); if(!/RCD|RCBO|mA/i.test(t)) return false; const m=/(\d+)\s*mA/i.exec(t); return !!m && +m[1]<=30; }
function zsRequired(a){ return isSocketCct(a)&&!rcd30(a); }
function hasRcd(a){ return /RCD|RCBO/i.test(a.prot||''); }
function needsIsolation(a){ return /SC\d|VSD|EC/i.test((a.starter||'')+' '+(a.model||'')+' '+a.tag) }

/* Sections for an asset: key, title, kind */
function sectionsFor(a){
  const s=[];
  if(isMotor(a)){
    s.push({key:'np',title:'Motor nameplate',group:'Motor'});
    s.push({key:'mir',title:'Motor insulation',group:'Motor'});
    s.push({key:'wr',title:'Winding resistance',group:'Motor'});
    s.push({key:'rot',title:'Rotation & connections',group:'Motor'});
    s.push({key:'st',title:'Starter inspection',group:'Motor'});
  }
  const cs = (a.cables&&a.cables.length)? a.cables : [{no:'',type:'',size:'',len:''}];
  cs.forEach((c,i)=>{
    const g = 'Cable '+(cs.length>1?(i+1)+' of '+cs.length+': ':'')+(c.no||'(no cable no.)');
    s.push({key:'c'+i+'.ct',title:'Continuity',group:g,cable:i});
    if(isEarthCable(c)){ s.push({key:'c'+i+'.ck',title:'Installation checks',group:g,cable:i}); return; }
    s.push({key:'c'+i+'.ir',title:'Insulation resistance',group:g,cable:i});
    if(!isSignal(c)){
      s.push({key:'c'+i+'.pol',title:is3ph(c)?'Polarity & phase sequence':'Polarity',group:g,cable:i});
      if(!isDriveOutput(c)) s.push({key:'c'+i+'.zs',title:'Earth fault-loop impedance',group:g,cable:i,optional:!zsRequired(a)});
    }
    s.push({key:'c'+i+'.ck',title:'Installation checks',group:g,cable:i});
  });
  if(hasRcd(a)) s.push({key:'rcd',title:'RCD operation',group:'Protection & function'});
  if(a.kind!=='circuit') s.push({key:'fn',title:'Functional test',group:'Protection & function'});
  return s;
}

    {id:'coil',label:'Coil voltage',type:'text'},{id:'cable',label:'Motor cable size',type:'text',pre:a.cables&&a.cables[0]?(a.cables[0].size+'mm²'):''},
    {id:'ct',label:'CT ratio',type:'text'},{id:'ol',label:'Overload setting',type:'text',pre:a.ol},

function parseNum(v){
  if(v==null) return NaN; const s=String(v).trim().toUpperCase();
  if(!s) return NaN;
  if(/^(OL|INF|∞|>)/.test(s)) return Infinity;
  const n=parseFloat(s.replace(',','.')); return n;
}
function judge(a,sec,vals,na){
  if(na) return {result:'na',why:''};
  const f=fieldsFor(a,sec); let fail=[],warn=[],filled=0;
  for(const x of f){
    const v=vals[x.id]; if(v!==undefined && v!=='') filled++;
    if(x.type==='ir'){ const n=parseNum(v); if(!isNaN(n) && n<IR_PASS) fail.push(x.label+' '+v+' MΩ < '+IR_PASS); }
    if(x.type==='ohm' && sec.key!=='wr'){ const n=parseNum(v); if(!isNaN(n) && n>CONT_PASS) fail.push(x.label+' '+v+' Ω > '+CONT_PASS); }
    if(x.type==='ynna' && v==='N') fail.push(x.label+': No');
    if(x.type==='ms' && x.max){ const n=parseNum(v); if(isFinite(n) && n>x.max) fail.push(x.label+' '+v+' ms > '+x.max); }
    if(x.type==='amp'){ const n=parseNum(v), fl=parseNum(a.flc); if(isFinite(n)&&isFinite(fl)&&fl>0&&n>fl) warn.push(x.label+' '+v+' A above FLC '+a.flc+' A'); }
  }
  if(sec.key.endsWith('.zs')){
    const dead=zsDead(vals), z=parseNum(dead?vals.rph:vals.zs), zx=zsMaxFor(vals), nm=dead?'Dead-test resistance ':'Zs ';
    if(isFinite(z)&&zx&&z>zx.z) fail.push(nm+(dead?vals.rph:vals.zs)+' Ω > max '+zx.z+' Ω'+(zx.src==='calc'?' (calculated '+zx.txt+')':''));
    else if(dead&&isFinite(z)&&zx&&z>zx.z*0.9) warn.push('Reading is within 10% of the '+zx.z+' Ω limit – confirm it, or retest live');
    else if(isFinite(z)&&!zx) warn.push('Enter Zs max to confirm disconnection time');
  }
  if(sec.key==='wr'){
    const ph=['R-Y','R-B','Y-B'].map(i=>parseNum(vals[i])).filter(n=>isFinite(n)&&n>0);
    if(ph.length===3){ const mx=Math.max(...ph), mn=Math.min(...ph); if((mx-mn)/mn>0.05) warn.push('Winding imbalance '+(((mx-mn)/mn)*100).toFixed(1)+'% (>5%)'); }
  }
  if(!filled) return {result:'',why:'Nothing entered'};
  if(fail.length) return {result:'fail',why:fail.join('; ')};
  if(warn.length) return {result:'warn',why:warn.join('; ')};
  const measured=f.some(x=>['ir','ohm','ynna','z','ms','amp'].includes(x.type));
  return {result: measured?'pass':'rec', why:''};
}

const BK=[['ct','Cont. OK','chk'],['ir','IR MΩ','num'],['pol','Polarity OK','chk'],['zs','Loop Ω','num'],['t1','RCD 1× ms','num'],['t5','RCD 5× ms','num'],['ck','Checks OK','chk']];
function viewBulk(b){
  B={b,rows:(b.circuits||[]).filter(c=>!isSpare(c)).map(c=>{ const [a,ci]=cctAsset(b,c); if(!a) return null; const secs={}; sectionsFor(a).forEach(s=>{ if(s.cable===ci) secs[s.key.split('.')[1]]=s; else if(s.key==='rcd') secs.rcd=s; }); return {c,a,ci,secs}; }).filter(Boolean)};
  const iso=B.rows.some(r=>r.secs.ir&&needsIsolation(r.a));
  const cell=(r,i,[k,,type])=>{ const sec=k==='t1'||k==='t5'?r.secs.rcd:r.secs[k]; if(!sec) return '<td class="na">–</td>'; const t=S.latest[r.a.tag+'|'+sec.key];
    const had=t?(t.result==='fail'?'FAIL':k==='ir'?'saved':k==='zs'?(t.values.zs||t.values.rph||'saved'):k==='t1'?(t.values.t1||''):k==='t5'?(t.values.t5||''):'✓'):'';

   ${iso?`<label class="safety"><input type="checkbox" id="isoChk"><span><b>Before insulation testing:</b> drive / EC fan electronics are isolated and disconnected.</span></label>`:''}
   <div class="actions"><button class="btn" type="button" data-act="bulkAll" data-v="ct">Tick all continuity</button><button class="btn" type="button" data-act="bulkAll" data-v="ir">All IR &gt;${esc(irMax())}</button><button class="btn" type="button" data-act="bulkAll" data-v="pol">Tick all polarity</button><button class="btn" type="button" data-act="bulkAll" data-v="ck">Tick all checks</button>
     <label class="hint" style="align-self:center">Loop test: <select id="b_method"><option ${LAST.method!=='Dead'?'selected':''}>Live</option><option ${LAST.method==='Dead'?'selected':''}>Dead</option></select></label></div>
   <div class="tablewrap"><table class="sched bulk"><thead><tr><th>Cct</th><th>Description</th>${BK.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>
   ${B.rows.map((r,i)=>`<tr><td class="tag">${esc(r.c.id)}</td><td>${esc(r.c.desc||'')}<div class="d">${esc(r.c.prot||'')}${r.c.asset?' · '+esc(r.c.asset):''}</div></td>${BK.map(k=>cell(r,i,k)).join('')}</tr>`).join('')}
   </tbody></table></div>
   ${commonHtml()}<div class="hint" id="bsum"></div><button class="btn primary big" type="submit" id="saveBtn">Save</button></form>`;
}
function bulkVals(r,k,v,method){
  const sec=k==='rcd'?r.secs.rcd:r.secs[k]; const fields=fieldsFor(r.a,sec); const vals={}; fields.forEach(f=>{ if(f.pre!==undefined&&f.pre!==null&&f.pre!=='') vals[f.id]=String(f.pre); });
  if(k==='ct') fields.filter(f=>f.type==='ohm').forEach(f=>vals[f.id]='OK');
  else if(k==='ir') fields.filter(f=>f.type==='ir').forEach(f=>vals[f.id]=v);
  else if(k==='pol'||k==='ck') fields.filter(f=>f.type==='ynna').forEach(f=>vals[f.id]='Y');
  else if(k==='zs'){ vals.method=method; vals[method==='Dead'?'rph':'zs']=v; }
  else if(k==='rcd'){ if(v.t1) vals.t1=v.t1; if(v.t5) vals.t5=v.t5; }
  return {sec,vals};
}
function bulkCollect(){
  const form=$('#bform'); const method=$('#b_method').value; const out=[];
  B.rows.forEach((r,i)=>{ const g=k=>form.querySelector(`[data-b="${i}"][data-k="${k}"]`); const val=k=>{ const e=g(k); return e?(e.type==='checkbox'?e.checked:e.value.trim()):''; };
    ['ct','pol','ck'].forEach(k=>{ if(val(k)) out.push(Object.assign({r,k,el:g(k)},bulkVals(r,k,true,method))); });
    ['ir','zs'].forEach(k=>{ const v=val(k); if(v) out.push(Object.assign({r,k,el:g(k)},bulkVals(r,k,v,method))); });
    const t1=val('t1'), t5=val('t5'); if(t1||t5) out.push(Object.assign({r,k:'rcd',el:g('t1')},bulkVals(r,'rcd',{t1,t5},method))); });
  out.forEach(o=>{ o.j=judge(o.r.a,o.sec,o.vals,false); });
  return out;
}
function updateBulk(){
  const form=$('#bform'); if(!form||!B) return; form.querySelectorAll('input.bad,input.good,input.warnc').forEach(e=>e.classList.remove('bad','good','warnc'));
  const out=bulkCollect(); let f=0; out.forEach(o=>{ if(o.j.result==='fail') f++; const mark=e=>{ if(e&&e.type!=='checkbox'&&e.value.trim()) e.classList.add(o.j.result==='fail'?'bad':o.j.result==='warn'?'warnc':'good'); };
    mark(o.el); if(o.k==='rcd') mark(form.querySelector(`[data-b="${B.rows.indexOf(o.r)}"][data-k="t5"]`)); });
  $('#bsum').textContent=out.length?out.length+' test'+(out.length===1?'':'s')+' ready to save'+(f?' · '+f+' will FAIL':''):''; $('#saveBtn').textContent=out.length?'Save '+out.length+' test'+(out.length===1?'':'s'):'Save';
}
function wireBulk(){ const form=$('#bform'); if(!form) return; form.addEventListener('input',updateBulk); form.addEventListener('change',updateBulk); form.addEventListener('submit',e=>{ e.preventDefault(); saveBulk(); }); updateBulk(); }
async function saveBulk(){
  const out=bulkCollect().filter(o=>o.j.result); if(!out.length){ toast('Nothing entered yet'); return; }
  const c=readCommon(); if(!c) return;
  const iso=$('#isoChk'); if(iso&&!iso.checked&&out.some(o=>o.k==='ir'&&needsIsolation(o.r.a))){ toast('Confirm the drive / EC electronics are isolated'); iso.focus(); return; } c.iso=iso?iso.checked:null;
  remember({method:$('#b_method').value});
  const btn=$('#saveBtn'); btn.disabled=true; let ok=0,fails=0,queued=0; const name=B.b.name;
  try{ for(const o of out){ btn.textContent='Saving '+(ok+1)+' of '+out.length+'…'; const r=await S.db.collection('tests').add(makeRec(o.r.a,o.sec,o.vals,o.j,c)); ok++; if(o.j.result==='fail') fails++; if(r.queued) queued++;
      o.el.type==='checkbox'?(o.el.checked=false):(o.el.value=''); if(o.k==='rcd'){ const e5=$('#bform').querySelector(`[data-b="${B.rows.indexOf(o.r)}"][data-k="t5"]`); if(e5) e5.value=''; } }
    toast((queued?'Saved on this device – ':'Saved ')+ok+' test'+(ok===1?'':'s')+(fails?' · '+fails+' FAIL added to Defects':'')); B=null; S.board=name; S.tab='boards'; S.view='board'; render(); window.scrollTo(0,0);
  }catch(e){ btn.disabled=false; updateBulk(); toast('Saved '+ok+' of '+out.length+', then failed ('+(e.code||'error')+'). Saved cells are cleared – press Save again for the rest.'); }
}

/* ================= Defects =================
   A failed test IS a defect: it opens when the test fails and closes itself when that test is redone and passes.
   The defects table only holds what people add on top (owner, priority, notes, photos, manual close) and defects raised by hand. */
function defectList(){
  const out=[]; const byKey={};
  S.tests.filter(t=>!t.voided).slice().sort((x,y)=>(x.at||'').localeCompare(y.at||'')).forEach(t=>{ (byKey[t.asset+'|'+t.section]=byKey[t.asset+'|'+t.section]||[]).push(t); });
  for(const k in byKey){ let cur=null; for(const t of byKey[k]){
    if(t.result==='fail'){ if(!cur){ cur={id:'F~'+t._id,kind:'test',asset:t.asset,section:t.section,first:t,last:t,at:t.at,by:t.testerName||''}; out.push(cur); } else cur.last=t; }
    else if(cur){ cur.fixed=t; cur=null; } } }
  out.forEach(d=>{ const a=A(d.asset); const sec=a&&sectionsFor(a).find(s=>s.key===d.section); d.title=(sec?sec.title:d.section)+' failed'; d.detail=d.last.why||''; d.desc=a?a.desc:''; });
  Object.values(S.defects).forEach(o=>{ if(o.key&&o.key.startsWith('M~')) out.push({id:o.key,kind:'manual',asset:o.asset||'',title:o.title||'Defect',detail:o.detail||'',at:o.at,by:o.by||'',desc:(A(o.asset)||{}).desc||''}); });
  out.forEach(d=>{ const o=S.defects[d.id]||{}; d.o=o; d.owner=o.owner||''; d.priority=o.priority||'Normal'; d.due=o.due||''; d.notes=o.notes||[]; d.photos=o.photos||[];
    d.status= d.fixed?'closed': o.status==='closed'?'closed':'open';
    d.closedHow= d.fixed?('Retest passed – '+(d.fixed.testerName||'')+', '+fmtDate(d.fixed.testDate||d.fixed.at)): o.status==='closed'?('Closed by '+(o.closedBy||'?')+', '+fmtDate(o.closedAt)+(o.closeNote?' – '+o.closeNote:'')):''; });
  const pr={High:0,Normal:1,Low:2};
  return out.sort((x,y)=>(x.status==='open'?0:1)-(y.status==='open'?0:1)||pr[x.priority]-pr[y.priority]||(y.at||'').localeCompare(x.at||''));
}
const openDefects=()=>defectList().filter(d=>d.status==='open');
async function saveDefect(key,patch){
  const cur=S.defects[key]||{key,job:S.job}; const rec=Object.assign({},cur,patch,{key,job:S.job,updatedAt:new Date().toISOString(),updatedBy:S.profile.name||S.email||''}); delete rec._id;
  const id=idOf(S.job,'DEF~'+key); S.defects[key]=rec;
  const row={table:'defects',id,job:S.job,data:rec};
  if(navigator.onLine===false||S.noSession){ await queueRow(row); return {queued:true}; }
  const {error:e}=await withTimeout(sb.from('defects').upsert({id,job:S.job,data:rec}),10000);
  if(!e) return {};
  if(errOf(e).code==='unavailable'){ setOffline(true); await queueRow(row); return {queued:true}; }
  throw errOf(e);
}

}

     <div class="actions"><button class="btn primary" type="submit">Save</button>
       ${d.kind==='test'&&isOpen&&A(d.asset)?`<button class="btn" type="button" data-act="defRetest" data-v="${esc(d.id)}">Retest now</button>`:''}

       ${!isOpen&&!d.fixed?`<button class="btn" type="button" data-act="defReopen" data-v="${esc(d.id)}">Reopen</button>`:''}
       <button class="btn" type="button" data-act="close">Cancel</button></div></form>`);
  const collect=()=>{ const p={owner:$('#d_owner').value.trim(),priority:$('#d_pri').value,due:$('#d_due').value}; const t=$('#d_note').value.trim(); if(t) p.notes=(o.notes||[]).concat([{at:new Date().toISOString(),by:S.profile.name||S.email||'',text:t}]); return p; };

let DEF_CTX=null;
async function defAction(act,id){
  const c=DEF_CTX; const d=c&&c.id===id?c.d:defectList().find(x=>x.id===id); if(!d) return;
  try{
    if(act==='defRetest'){ if(c&&c.id===id){ const p=c.collect(); if(p.notes||p.owner!==d.owner||p.priority!==d.priority||p.due!==d.due) await saveDefect(id,p); } closeModal(); S.backBoard=null; S.asset=d.asset; S.section=d.section; S.view='form'; F=null; render(); window.scrollTo(0,0); }
    else if(act==='defClose'){ const p=c&&c.id===id?c.collect():{}; const note=(p.notes&&p.notes[p.notes.length-1].text)||''; if(d.kind==='test'&&!note){ toast('Add a note saying why it is closed without a retest'); const n=$('#d_note'); if(n) n.focus(); return; }

}

function defStripForAsset(a){
  const ds=openDefects().filter(d=>d.asset===a.tag); if(!ds.length) return '';
  return `<div class="card" style="border-color:var(--fail)"><h3>Open defects (${ds.length})</h3><div class="list">${ds.map(defRow).join('')}</div></div>`;
}
function defCsv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['status','tag','description','defect','detail','priority','owner','fix_by','raised','raised_by','closed','notes']].concat(defectList().map(d=>[d.status,d.asset,d.desc,d.title,d.detail,d.priority,d.owner,d.due,(d.at||'').slice(0,10),d.by,d.closedHow,d.notes.map(n=>(n.by||'')+': '+n.text).join(' | ')]));
  download(S.job+'_defects.csv',rows.map(r=>r.map(q).join(',')).join('\r\n'));
}
function defClick(act,b){
  const v=b.dataset.v;
  if(act==='defOpen'){ openDefect(v); return true; }
  if(act==='defNew'){ openDefNew(S.view==='asset'&&A(S.asset)?S.asset:''); return true; }
  if(act==='defFilter'){ S.dfilter=v; render(); return true; }
  if(act==='defCsv'){ defCsv(); return true; }
  if(act==='defRetest'||act==='defClose'||act==='defReopen'){ defAction(act,v); return true; }
  return false;
}

function canSummary(){ if(!WIDE()) return false;   // computer only – phones stay on the site-work tabs
  if(S.canEdit) return true; const l=((S.jobs[S.job]||{}).summaryUsers)||[]; const me=String(S.email||'').toLowerCase(); return !!me&&l.map(x=>String(x).toLowerCase()).includes(me); }
function viewSummary(){
  const all=Object.values(S.assets); const tot={none:0,part:0,done:0,fail:0}, tests={done:0,total:0};
  const groups={}; const fails=[];
  const addFail=a=>{ sectionsFor(a).forEach(s=>{ const t=S.latest[a.tag+'|'+s.key]; if(t&&t.result==='fail') fails.push({a,s,t}); }); };
  all.forEach(a=>{ const s=assetStatus(a); tot[s.st]++; tests.done+=s.done; tests.total+=s.total; const g=a.group||a.area||'Other'; const G=groups[g]=groups[g]||{none:0,part:0,done:0,fail:0,n:0}; G[s.st]++; G.n++; if(s.st==='fail') addFail(a); });
  Object.values(S.circuits).forEach(a=>{ if(assetStatus(a).st==='fail') addFail(a); });
  const bs=Object.values(S.boards).sort((x,y)=>(x.order??999)-(y.order??999)); let bn=0,bd=0,bf=0;
  const brow=bs.map(b=>{ const r=boardSummary(b); bn+=r.n; bd+=r.done; bf+=r.fail; return {b,r}; });
  const live=S.tests.filter(t=>!t.voided); const by={};
  live.forEach(t=>{ const k=t.testerName||'?'; const o=by[k]=by[k]||{n:0,fail:0,last:''}; o.n++; if(t.result==='fail') o.fail++; const d=t.testDate||(t.at||'').slice(0,10); if(d>o.last) o.last=d; });
  const days=[]; for(let i=13;i>=0;i--){ const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10); days.push({d,n:live.filter(t=>(t.testDate||(t.at||'').slice(0,10))===d).length}); }
  const mx=Math.max(1,...days.map(x=>x.n));
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const bar=(o,n)=>`<div class="sbar" role="img" aria-label="${o.done} complete, ${o.part} in progress, ${o.fail} with a fail, ${o.none} not started">${['done','part','fail','none'].map(k=>o[k]?`<span class="b-${k}" style="width:${o[k]/n*100}%"></span>`:'').join('')}</div>`;
  const n=all.length;
  return `<div class="actions"><button class="btn office" type="button" data-act="csv">Export results CSV</button><button class="btn office" type="button" data-act="coc">CoC draft</button>${S.canEdit?'<button class="btn office" type="button" data-act="sumAccess">Who can see this</button>':''}</div>
  <div class="stats">
    <div class="stat done"><b>${pct(tot.done,n)}%</b><span>Assets complete (${tot.done}/${n})</span></div>
    <div class="stat part"><b>${pct(tests.done,tests.total)}%</b><span>Tests passed (${tests.done}/${tests.total})</span></div>
    <div class="stat fail"><b>${fails.length}</b><span>Open failed tests</span></div>
    <div class="stat"><b>${bn?pct(bd,bn)+'%':'–'}</b><span>DB circuits complete (${bd}/${bn})</span></div>
  </div>
  <div class="sumgrid">
  <div class="card"><h3>By area</h3><div class="tablewrap"><table class="hist sum"><thead><tr><th>Area</th><th>Progress</th><th>Done</th><th>In prog.</th><th>Fail</th><th>Not started</th></tr></thead><tbody>
    ${Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0])).map(([g,o])=>`<tr class="click" data-act="sumGroup" data-v="${esc(g)}" tabindex="0" role="button"><td><b>${esc(g)}</b></td><td style="min-width:120px">${bar(o,o.n)}</td><td>${o.done}/${o.n}</td><td>${o.part||''}</td><td class="${o.fail?'bad':''}">${o.fail||''}</td><td>${o.none||''}</td></tr>`).join('')}
    </tbody></table></div><p class="hint"><span class="key b-done"></span> complete <span class="key b-part"></span> in progress <span class="key b-fail"></span> has a fail <span class="key b-none"></span> not started · tap an area to list its assets</p></div>
  <div class="card"><h3>By board</h3>${brow.length?`<div class="tablewrap"><table class="hist sum"><thead><tr><th>Board</th><th>Progress</th><th>Done</th><th>Fail</th><th>Spare</th></tr></thead><tbody>
    ${brow.map(({b,r})=>`<tr class="click" data-act="board" data-v="${esc(b.name)}" tabindex="0" role="button"><td><b class="tag">${esc(b.name)}</b></td><td style="min-width:120px">${bar(r,Math.max(1,r.n))}</td><td>${r.done}/${r.n}</td><td class="${r.fail?'bad':''}">${r.fail||''}</td><td>${r.spare||''}</td></tr>`).join('')}
    </tbody></table></div>`:'<p class="hint">No DB schedules for this job.</p>'}</div>
  <div class="card"><h3>Open failed tests (${fails.length})</h3>${fails.length?`<div class="list">${fails.slice(0,60).map(({a,s,t})=>`<button class="row s-fail" type="button" data-act="open" data-v="${esc(a.tag)}"><span class="stripe"></span><span><span class="t1"><span class="tag">${esc(a.tag)}</span><span class="d">${esc(s.title)}</span></span><span class="d" style="display:block;color:var(--ink)">${esc(t.why||'Failed')}</span><span class="d">${esc(a.desc||'')} · ${esc(t.testerName||'')} · ${esc(fmtDate(t.testDate||t.at))}</span></span><span></span></button>`).join('')}</div>${fails.length>60?'<p class="hint">Showing the first 60.</p>':''}`:'<p class="hint">Nothing is currently failing.</p>'}</div>
  <div class="card"><h3>Last 14 days</h3><div class="days" role="img" aria-label="Tests saved per day">${days.map(x=>`<div title="${esc(fmtDate(x.d))}: ${x.n} tests"><span style="height:${x.n?Math.max(6,x.n/mx*100):0}%"></span><small>${x.n||''}</small><em>${x.d.slice(8)}</em></div>`).join('')}</div>
    <h3 style="margin-top:14px">By tester</h3>${Object.keys(by).length?`<div class="tablewrap"><table class="hist sum"><thead><tr><th>Tester</th><th>Tests saved</th><th>Fails recorded</th><th>Last test</th></tr></thead><tbody>
    ${Object.entries(by).sort((a,b)=>b[1].n-a[1].n).map(([k,o])=>`<tr><td><b>${esc(k)}</b></td><td>${o.n}</td><td>${o.fail||''}</td><td>${esc(fmtDate(o.last))}</td></tr>`).join('')}</tbody></table></div>`:'<p class="hint">No tests saved yet.</p>'}</div>
  </div>`;
}
function openSumAccess(){
  const l=((S.jobs[S.job]||{}).summaryUsers)||[];
  modal(`<h2>Who can see the summary – ${esc(S.job)}</h2><p class="hint">Admins always see the Summary tab. Add the email of anyone else who should see it for this job, one per line – use the email they sign in with. Everyone else just sees Assets, DB schedules and Drawings.</p>
   <form id="saform" class="test"><div class="field"><label for="sa_list">Emails</label><textarea id="sa_list" rows="6" placeholder="name@nzelectricalsolutions.nz">${esc(l.join('\n'))}</textarea></div>
   <div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-act="close">Cancel</button></div></form>`);
  $('#saform').addEventListener('submit',async e=>{ e.preventDefault(); const list=[...new Set($('#sa_list').value.split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean))];
    const bad=list.find(x=>!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)); if(bad){ toast('Not an email: '+bad); return; }
    try{ await S.db.doc('jobs/'+S.job).update({summaryUsers:list}); S.jobs[S.job]=Object.assign({},S.jobs[S.job],{summaryUsers:list}); closeModal(); toast('Saved'); render(); }catch(err){ toast('Could not save ('+(err.code||'error')+')'); } });
}

function filteredAssets(){
  const q=S.q.trim().toLowerCase();
  return Object.values(S.assets).filter(a=>{
    if(S.group!=='All' && a.group!==S.group) return false;
    if(S.status!=='All' && assetStatus(a).st!==S.status) return false;
    if(!q) return true;
    const hay=(a.tag+' '+a.desc+' '+a.area+' '+(a.cables||[]).map(c=>c.no).join(' ')).toLowerCase();
    return q.split(/\s+/).every(w=>hay.includes(w));
  }).sort((x,y)=>(x.order??999)-(y.order??999)||x.tag.localeCompare(y.tag));
}

function valSummary(a,sec,t){
  if(!t) return '';
  if(t.result==='na') return 'N/A'+(t.notes?' – '+t.notes:'');
  const f=fieldsFor(a,sec); const unit=x=>UNIT[x.type]||'';
  if(sec.key.endsWith('.ck')||sec.key==='st'){
    const n=f.filter(x=>x.check&&t.values[x.id]==='N').length, y=f.filter(x=>x.check&&t.values[x.id]==='Y').length;
    if(sec.key==='st') return [t.values.fuse,t.values.ol&&('OL '+t.values.ol)].filter(Boolean).join(' · ')+(y||n?` · ${y}✓ ${n}✗`:'');
    return `${y} yes · ${n} no`;
  }
  if(sec.key.endsWith('.ct') && f.filter(x=>x.type==='ohm').every(x=>t.values[x.id]==='OK')) return 'Continuity OK – all cores';
  return f.filter(x=>t.values[x.id]).map(x=>x.label+' '+t.values[x.id]+(isNaN(parseNum(t.values[x.id]))?'':unit(x))).join(' · ');
}

let F=null; // current form state
function viewForm(a,key){
  const sec=sectionsFor(a).find(s=>s.key===key); if(!sec){S.view='asset';return viewAsset(a);}
  const prev=S.latest[a.tag+'|'+key];
  const fields=fieldsFor(a,sec);
  const vals={}; fields.forEach(f=>{ const pv=cleanPrev(prev,f.id); vals[f.id]= pv!==undefined? pv : (f.pre!==undefined&&f.pre!==null?String(f.pre):''); });
  F={a,sec,fields,vals,na:prev?prev.result==='na':false,iso:false,photo:'',prevPhoto:prev&&prev.photo||''};
  const P=S.profile;
  const iso = (key==='mir'||key.endsWith('.ir')) && needsIsolation(a);
  const hasIR=fields.some(f=>f.type==='ir'); const hasCk=fields.some(f=>f.type==='ynna');
  const c=sec.cable!=null?(a.cables||[])[sec.cable]:null;
  return `
  <div class="actions"><button class="btn" type="button" data-act="back">← ${esc(a.tag)}</button></div>
  <form class="test card" id="tform" autocomplete="off">
    <div><h2>${esc(sec.title)}</h2><div class="hint"><span class="tag">${esc(a.tag)}</span> · ${esc(a.desc)}${c?' · <span class="tag">'+esc(c.no)+'</span> '+esc([c.type,c.size&&c.size+'mm²'].filter(Boolean).join(' ')):''}</div>
    ${prev?`<div class="hint">Last saved by ${esc(prev.testerName||'?')} on ${esc(fmtDate(prev.testDate||prev.at))}. Saving again keeps that record in history.</div>`:''}</div>
    ${iso?`<label class="safety"><input type="checkbox" id="isoChk"><span><b>Before testing:</b> drive / EC fan electronics are isolated and disconnected from the circuit under test. Do not insulation-test through a VSD or EC motor controller.</span></label>`:''}
    <div class="fgrid" id="fgrid">${fields.filter(f=>f.type!=='ynna').map(fieldHtml).join('')}</div>
    ${key==='np'?`<div class="actions">${S.canImg?'<label class="camlabel primary" for="np_cam">🔎 Photo the nameplate – fill these in<input id="np_cam" type="file" accept="image/*" capture="environment"></label>':''}

function fieldHtml(f){
  const v=F.vals[f.id]??''; const id='v_'+f.id.replace(/[^A-Za-z0-9]/g,'_');
  if(f.type==='seg'||f.type==='ynna'){
    const opts=f.type==='ynna'?YNN:f.opts;
    const cls=o=>f.type==='ynna'?(o==='Y'?'y':o==='N'?'n':'x'):'o';
    const seg=`<div class="seg" role="group" aria-label="${esc(f.label)}">${opts.map(o=>`<button type="button" class="${cls(o)}" data-act="seg" data-f="${esc(f.id)}" data-v="${esc(o)}" aria-pressed="${v===o}">${esc(o==='Y'?'Yes':o==='N'?'No':o)}</button>`).join('')}</div>`;
    if(f.type==='ynna') return `<div class="checkrow"><span>${esc(f.label)}</span>${seg}</div>`;
    return `<div class="field" style="grid-column:span 2"><label>${esc(f.label)}</label>${seg}</div>`;
  }
  const unit=UNIT[f.type]?' ('+UNIT[f.type].trim()+')':'';
  const im=f.type==='text'?'text':'decimal';
  return `<div class="field"><label for="${id}">${esc(f.label+unit)}</label><input id="${id}" data-f="${esc(f.id)}" data-t="${f.type}" inputmode="${im}" value="${esc(v)}"></div>`;
}
function wireForm(){
  const form=$('#tform'); if(!form) return;
  form.addEventListener('input',e=>{ const f=e.target.dataset&&e.target.dataset.f; if(f){F.vals[f]=e.target.value; markInput(e.target); if(f==='zmax'||f==='In'){form.querySelectorAll('input[data-f="zs"],input[data-f="rph"]').forEach(markInput);}} if(e.target.id==='naChk'){F.na=e.target.checked;} updateResult(); });
  form.addEventListener('change',e=>{ if(e.target.id==='naChk'){F.na=e.target.checked; updateResult();} });
  form.addEventListener('submit',e=>{ e.preventDefault(); saveTest(); });
  form.querySelectorAll('input[data-f]').forEach(markInput); updateResult();
  const npc=$('#np_cam'); if(npc) npc.addEventListener('change',async e=>{ const f=(e.target.files||[])[0]; e.target.value=''; if(!f) return;
    const msg=$('#npmsg'); const blob=await shrinkImage(f);
    if(S.assetsCap){ S.assetsCap.upload(blob,{type:'image/jpeg'}).then(r=>{ F.photo=r.id; $('#npphoto').innerHTML=photoStrip([r.id],false); }).catch(()=>{ msg.textContent='Photo not stored – values still read'; }); }
    if(!S.canImg){ msg.textContent='Photo attached'; return; }
    msg.textContent='Reading nameplate… (can take ~20 s)';
    try{ const d=await readNameplate(blob); let n=0;
      const set=(id,v)=>{ v=String(v??'').trim(); if(!v) return; F.vals[id]=v; n++; const el=form.querySelector('input[data-f="'+id+'"]'); if(el) el.value=v;
        const sg=form.querySelector('.seg [data-f="'+id+'"]'); if(sg) form.querySelectorAll('.seg [data-f="'+id+'"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v)); };
      set('kw',d.kw); set('fla',d.flc); set('rpm',d.rpm); set('volts',String(d.volts||'').replace(/[^0-9\/]/g,'')); set('serial',d.serial); set('model',[d.make,d.model].filter(Boolean).join(' ')); set('frame',d.frame);
      if(/star|wye|\bY\b/i.test(d.connection||'')) set('conn','Star'); else if(/delta|Δ/i.test(d.connection||'')) set('conn','Delta');
      updateResult(); msg.textContent= n?'Filled '+n+' fields – check against the plate'+(d.notes?' ('+d.notes+')':''):'Could not read the plate – try a closer, square-on photo';
    }catch(err){ msg.textContent= err.code==='not_granted'?'Allow Claude access to read nameplates':'Nameplate read failed ('+(err.code||'error')+') – enter manually'; }
  });
}
function markInput(el){
  const t=el.dataset.t; const n=parseNum(el.value); el.classList.remove('bad','good');
  if(el.value==='OK'){ el.classList.add('good'); return; }
  if(!el.value||isNaN(n)) return;
  if(t==='ir') el.classList.add(n<IR_PASS?'bad':'good');
  if(t==='ohm' && F.sec.key!=='wr') el.classList.add(n>CONT_PASS?'bad':'good');
  if(t==='ms'){ const f=F.fields.find(x=>x.id===el.dataset.f); if(f&&f.max) el.classList.add(n>f.max?'bad':'good'); }
  if(t==='z' && (el.dataset.f==='zs'||el.dataset.f==='rph')){ const zx=zsMaxFor(F.vals); if(zx) el.classList.add(n>zx.z?'bad':'good'); }
}
function updateResult(){
  if(S.view==='multi'){ updateMulti(); return; }
  const j=judge(F.a,F.sec,F.vals,F.na); const el=$('#resultLine'); if(!el) return;
  const map={pass:['PASS','var(--pass)'],fail:['FAIL','var(--fail)'],warn:['CHECK','var(--warn)'],na:['NOT APPLICABLE','var(--muted)'],rec:['Recorded','var(--pass)'],'':['','var(--muted)']};
  limitHint();
  const [t,c]=map[j.result]; el.style.color=c; el.textContent=t+(j.why?' — '+j.why:'');
}
async function saveTest(){
  const btn=$('#saveBtn'); const tester=$('#f_tester').value.trim();
  if(!tester){ toast('Enter who did the test'); $('#f_tester').focus(); return; }
  const iso=$('#isoChk'); if(iso && !iso.checked && !F.na){ toast('Confirm the drive / EC electronics are isolated'); iso.focus(); return; }
  const j=judge(F.a,F.sec,F.vals,F.na);
  if(!j.result){ toast('Nothing entered yet'); return; }
  const vals={}; Object.entries(F.vals).forEach(([k,v])=>{ if(v!==''&&v!=null) vals[k]=String(v); });
  if(F.sec.key.endsWith('.zs')){ if(zsDead(F.vals)){ delete vals.zs; delete vals.pfc; } else delete vals.rph; }
  if(F.sec.key.endsWith('.zs')&&!vals.zmax){ const zx=zsMaxFor(F.vals); if(zx){ vals.zmax=String(zx.z); vals.zmaxSrc='calculated '+zx.txt; } }
  const rec={job:S.job,asset:F.a.tag,board:F.a.board||'',section:F.sec.key,cable:F.sec.cable!=null?((F.a.cables||[])[F.sec.cable]||{}).no||'':'',
    values:vals,result:j.result,why:j.why,testerName:tester,licence:S.profile.licence||'',
    instrument:$('#f_inst')?$('#f_inst').value.trim():'',serial:$('#f_ser')?$('#f_ser').value.trim():'',calDue:S.profile.calDue||'',
    limits:LIM(),testDate:$('#f_date').value||today(),at:new Date().toISOString(),photo:F.photo||(F.prevPhoto||''),by:S.uid||'',notes:$('#f_notes').value.trim(),officeNotes:$('#f_onotes')?$('#f_onotes').value.trim():'',isolated:iso?iso.checked:null};
  btn.disabled=true; btn.textContent='Saving…';
  try{
    const r=await S.db.collection('tests').add(rec);
    remember({tester:tester!==(S.profile.name||'')?tester:'',inst:rec.instrument&&rec.instrument!==(S.profile.instrument||'')?rec.instrument:LAST.inst||'',ser:rec.serial&&rec.serial!==(S.profile.serial||'')?rec.serial:LAST.ser||''}); if(vals.method) remember({method:vals.method}); if(vals.rtype) remember({rtype:vals.rtype}); S.justSaved=F.a.tag;
    toast(r.queued?'Saved on this device – uploads when signal returns':j.result==='fail'?'Saved – FAIL recorded and added to Defects':'Saved'); S.view='asset'; render();
  }catch(e){
    btn.disabled=false; btn.textContent='Save test';
    if(e.code==='invalid_argument'){ toast('You do not have permission to save – ask James.'); }
    else if(e.code==='quota_exceeded') toast('Database is full – tell James.');
    else if(e.code==='storage_full') toast('This device could not store the test – write it down and tell James.');
    else toast('Could not save ('+e.code+'). Try again.');
  }
}

function onClick(e){
  const ph=e.target.closest('img[data-photo]'); if(ph && !e.target.closest('#dform')){ viewPhoto(ph.dataset.photo); return; }

  else if(act==='newBoard'){openBoardEdit(null);}
  else if(act==='pdfBoard'){boardPdf(S.boards[v]);}
  else if(act==='beAdd'){E.b.circuits.push(blankCct()); render();}
  else if(act==='beDel'){E.b.circuits.splice(+v,1); render();}
  else if(act==='beUp'){const i=+v; if(i>0){const c=E.b.circuits; [c[i-1],c[i]]=[c[i],c[i-1]];} render();}
  else if(act==='beCancel'){const n=E.orig; E=null; if(n&&S.boards[n]){S.board=n;S.view='board';} else S.view='boards'; S.tab='boards'; render();}
  else if(act==='beSave'){saveBoard(b);}
  else if(act==='beRemove'){removeBoard(b);}
  else if(act==='back'){S.view='asset';render();window.scrollTo(0,0);}
  else if(act==='sec'){S.section=v;S.view='form';F=null;render();window.scrollTo(0,0);}
  else if(act==='group'){S.group=v;render();}
  else if(act==='status'){S.status=v;render();}
  else if(act==='seg'){ const f=b.dataset.f; F.vals[f]= F.vals[f]===v?'':v; b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===F.vals[f])); {document.querySelectorAll('input[data-f="zs"],input[data-f="rph"]').forEach(markInput);} updateResult(); }
  else if(act==='fillIR'){ const v='>'+irMax(); document.querySelectorAll('input[data-t="ir"]').forEach(i=>{i.value=v;F.vals[i.dataset.f]=v;markInput(i);}); updateResult(); }
  else if(act==='fillCont'){ document.querySelectorAll('input[data-t="ohm"]').forEach(i=>{i.value='OK';F.vals[i.dataset.f]='OK';markInput(i);}); updateResult(); }
  else if(act==='allY'){ F.fields.filter(f=>f.type==='ynna').forEach(f=>F.vals[f.id]='Y'); document.querySelectorAll('.checks .seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v==='Y')); updateResult(); }
  else if(act==='pdfOne') makePdf([A(S.asset)]);
  else if(act==='pdfList') makePdf(filteredAssets());
  else if(act==='pdfOneNN') makePdf([A(S.asset)],{noNotes:true});
  else if(act==='pdfListNN') makePdf(filteredAssets(),{noNotes:true});
  else if(act==='csv') exportCsv();
  else if(act==='import') openImport();
  else if(act==='addDev') openDevice(null);
  else if(act==='editDev') openDevice(S.asset);
  else if(act==='profile') openProfile();
  else if(act==='limits') openLimits();
  else if(act==='sumAccess') openSumAccess();
  else if(act==='sumGroup'){ S.group=v; S.status='All'; S.q=''; S.tab='assets'; S.view='home'; render(); window.scrollTo(0,0); }
  else if(act==='syncNow'){ if(navigator.onLine===false) toast('Still offline'); else { NET.reloaders.forEach(f=>f()); syncPending(); } }
  else if(act==='coc') openCoc(v||null);
  else if(act==='void') voidTest(v,b);
  else if(act==='noteOffice') noteToOffice(v,b);
  else if(act==='close') closeModal();
  else if(act==='copyLink'){ try{ navigator.clipboard.writeText(APP_URL).then(()=>toast('Link copied – paste it into Chrome'),()=>toast(APP_URL)); }catch(_){ toast(APP_URL); } }
}

async function noteToOffice(id,b){
  const t=(S.tests||[]).find(x=>x._id===id); if(!t||!t.notes||t.voided) return;
  if(!navigator.onLine){ toast('Needs signal – try again when online'); return; }
  if(b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.textContent='Tap again to move'; setTimeout(()=>{ if(b.isConnected){b.dataset.confirm='';b.textContent='Note → office';} },4000); return; }
  const rec=Object.assign({},t); delete rec._id; delete rec._pending; delete rec.voided; delete rec.voidedAt;
  rec.officeNotes=[t.officeNotes,t.notes].filter(Boolean).join(' | '); rec.notes=''; rec.noteMovedBy=S.profile.name||S.email||''; rec.noteMovedAt=new Date().toISOString();
  b.disabled=true;
  try{ await S.db.collection('tests').add(rec); await S.db.doc('tests/'+id).update({voided:true,voidedAt:new Date().toISOString()}); toast('Note moved to office note – it will no longer print'); }
  catch(e){ b.disabled=false; toast('Could not move the note ('+(e.code||e.message||'error')+')'); }
}
async function voidTest(id,b){
  if(b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.textContent='Tap again to void'; setTimeout(()=>{ if(b.isConnected){b.dataset.confirm='';b.textContent='Void';} },4000); return; }
  try{ await S.db.doc('tests/'+id).update({voided:true,voidedAt:new Date().toISOString()}); toast('Record voided'); }catch(e){ toast('Could not void ('+e.code+')'); }
}

      const prev=S.assets[tag]||{};
      const doc={job:S.job,tag,desc:g('description'),area:g('area'),group:g('group')||'Other Assets',type:g('type'),sheet:/MCTS|MOTOR/i.test(g('sheet'))?'MCTS':'CTS',

async function shrinkImage(file,max=1600,q=0.82){
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',q));
  }catch(e){ return file; }
}

  return await S.sample.json(prompt,{images:[blob],modelTier:'default'});
}

function parseCsv(t){ const out=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===','){row.push(cur);cur='';} else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n')i++; row.push(cur);cur=''; if(row.some(x=>x!==''))out.push(row); row=[]; } else cur+=ch; }
  row.push(cur); if(row.some(x=>x!==''))out.push(row); return out; }
const toCsv=rows=>rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\r\n');
async function download(name,data){
  if(!S.dl){ toast('Downloads are not available in this view'); return; }
  try{ await S.dl.save({filename:name,data}); }
  catch(e){ if(e.code!=='declined') toast('Download failed ('+e.code+')'); }
}
function exportCsv(){
  const head=['job','asset','description','test','cable','result','test_date','tested_by','registration','instrument','serial','values','notes','office_notes','saved_at'];
  const rows=[];
  Object.values(S.assets).forEach(a=>sectionsFor(a).forEach(s=>{ const t=S.latest[a.tag+'|'+s.key];
    rows.push([S.job,a.tag,a.desc,s.group+' – '+s.title,t?t.cable:'',t?t.result:s.optional?'not required':'not done',t?t.testDate:'',t?t.testerName:'',t?t.licence:'',t?t.instrument:'',t?t.serial:'',t?Object.entries(t.values||{}).map(([k,v])=>k+'='+v).join('; '):'',t?t.notes:'',t?(t.officeNotes||''):'',t?t.at:'']); }));
  download(S.job+' test results '+today()+'.csv',toCsv([head,...rows]));
}

function boardPdf(b){

  const cols=[['Cct',16],['Description',78],['Protection',26],['RCD',14],['Cable',44],['mm²',13],['Cont.',13],['IR Mohm',17],['Zs ohm',15],['RCD ms',15],['Tested',26]];
  let y;
  const head=()=>{
    doc.setFillColor(30,58,90); doc.rect(M,M,W-2*M,14,'F'); doc.setTextColor(255);
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text(pdfText('DISTRIBUTION BOARD SCHEDULE – '+b.name),M+3,M+9.3);
    doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.text(pdfText((job.name||S.job||'')+' · '+S.job),W-M-3,M+9.3,{align:'right'});

    let x=M; info.forEach(([k,v])=>{ doc.setFont('helvetica','bold'); doc.text(pdfText(k+':'),x,y); const kw=doc.getTextWidth(k+': '); doc.setFont('helvetica','normal'); const t=pdfText(v); doc.text(t,x+kw,y); x+=kw+doc.getTextWidth(t)+8; });
    y+=4; doc.setFillColor(232,236,241); doc.rect(M,y,W-2*M,7,'F'); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    let cx=M; cols.forEach(([t,w])=>{ doc.text(pdfText(t),cx+1.5,y+4.8); cx+=w; }); y+=7; doc.setFont('helvetica','normal');
  };
  head();
  (b.circuits||[]).forEach((c,i)=>{
    const r=isSpare(c)?{}:cctResults(b,c); const cb=c.cable||{};
    const desc=doc.splitTextToSize(pdfText((c.desc||'')+(c.asset?' ['+c.asset+']':'')),cols[1][1]-3);
    const cabl=doc.splitTextToSize(pdfText(cb.no||''),cols[4][1]-3);
    const h=Math.max(6,3.6*Math.max(desc.length,cabl.length)+2.4);
    if(y+h>H-M-8){ doc.addPage(); head(); }
    if(i%2){ doc.setFillColor(247,248,250); doc.rect(M,y,W-2*M,h,'F'); }
    const vals=[c.id,desc,c.prot||'',c.rcd==='N'?'-':c.rcd||'',cabl,cb.size||'',r.ct||'',r.ir||'',r.zs||'',r.rcd||'',r.date?fmtDate(r.date):''];
    let cx=M; doc.setFontSize(8.5);
    vals.forEach((v,j)=>{ if(j===10&&r.fail){ doc.setTextColor(198,47,47); v='FAIL '+v; } doc.text(Array.isArray(v)?v:pdfText(v),cx+1.5,y+4.2); doc.setTextColor(0); cx+=cols[j][1]; });
    doc.setDrawColor(210); doc.line(M,y+h,W-M,y+h); y+=h;
  });
  doc.setFontSize(7.5); doc.setTextColor(100);
  const pages=doc.getNumberOfPages();

  const fn=`${S.job}_${b.name}_DB_schedule.pdf`;

}

/* ================= Drawings (panel drawing sets) =================
   PDFs live in the private "drawings" bucket. Each set has an index of clickable
   hotspots per sheet: device tags (open the asset), cross-references (/123.4 jumps
   to sheet 123 column 4) and panel names. Rendered with pdf.js so sheets stay vector-sharp. */
const PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfjsReady=null; const PDF_CACHE={};
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(!pdfjsReady) pdfjsReady=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=PDFJS_URL;
    s.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; res(window.pdfjsLib); }; s.onerror=()=>{pdfjsReady=null; rej(new Error('pdf.js failed to load'));}; document.head.appendChild(s); });
  return pdfjsReady;
}
async function dwgFileBytes(path){
  if(PDF_CACHE[path]) return PDF_CACHE[path];
  const p=(async()=>{
    const cached=await dwgCacheGet(path); if(cached) return cached;
    const {data,error}=await sb.storage.from('drawings').download(path); if(error) throw error;
    const buf=await data.arrayBuffer(); dwgCachePut(path,buf); return buf;
  })();
  PDF_CACHE[path]=p; p.catch(()=>{ delete PDF_CACHE[path]; });
  return p;
}
async function dwgPdf(path){ const lib=await loadPdfJs(); const buf=await dwgFileBytes(path); return lib.getDocument({data:new Uint8Array(buf.slice(0))}).promise; }
/* Browser cache (Cache Storage) so sheets open without signal once viewed */
async function dwgCacheGet(path){ try{ const c=await caches.open('nzes-dwg'); const r=await c.match('/dwg/'+path); return r?await r.arrayBuffer():null; }catch(_){ return null; } }
async function dwgCachePut(path,buf){ try{ const c=await caches.open('nzes-dwg'); await c.put('/dwg/'+path,new Response(buf.slice(0),{headers:{'content-type':'application/pdf'}})); }catch(_){} }

}
